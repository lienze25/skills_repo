<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - Skills Repository</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text2: #8b949e;
    --accent: #58a6ff;
    --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-box {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 12px; padding: 48px; width: 360px; max-width: 90vw;
  }
  .login-box h1 { font-size: 22px; text-align: center; margin-bottom: 8px; }
  .login-box p { color: var(--text2); font-size: 13px; text-align: center; margin-bottom: 24px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text2); }
  .form-group input {
    width: 100%; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 14px; outline: none;
  }
  .form-group input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; padding: 10px 16px; border-radius: 6px; font-size: 14px;
    font-weight: 500; cursor: pointer; border: 1px solid var(--border);
    background: var(--accent); color: #fff; border-color: var(--accent);
    transition: .15s; margin-top: 8px;
  }
  .btn:hover { background: #4090e0; }
  .error { color: var(--red); font-size: 13px; text-align: center; margin-top: 12px; display: none; }
  .error.show { display: block; }
  .icp-footer {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 0;
    text-align: center; font-size: 12px; color: #8b949e;
    background: #161b22; border-top: 1px solid #30363d; z-index: 10;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>Skills Repository</h1>
  <p>请登录以继续</p>
  <form id="loginForm">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn">登录</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
(async function(){
  try{
    const res = await fetch('/api/config');
    const cfg = await res.json();
    const icp = cfg.icp_number;
    if(icp){
      const footer = document.createElement('footer');
      footer.className = 'icp-footer';
      footer.textContent = icp;
      document.body.appendChild(footer);
    }
  }catch(e){}
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  try {
    const res = await fetch('/api/login', { method: 'POST', body: formData });
    if (res.ok) {
      window.location.href = '/';
    } else {
      document.getElementById('error').textContent = '用户名或密码错误';
      document.getElementById('error').classList.add('show');
    }
  } catch {
    document.getElementById('error').textContent = '登录失败，请重试';
    document.getElementById('error').classList.add('show');
  }
});
</script>
</body>
</html>
